name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set. The release build cannot be signed."
          exit 1
        fi
        echo "$ENCODED_KEYSTORE" | base64 -di > keystore.jks
        echo "Keystore decoded successfully."
        ls -la keystore.jks

    - name: Build Release APK
      env:
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsRelease \
          -Pandroid.injected.signing.store.file=$(pwd)/keystore.jks \
          -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
          -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
          --no-daemon \
          --stacktrace

    - name: Verify APK was produced
      id: verify_apk
      run: |
        echo "=== Searching for built APK files ==="
        find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
        APK_COUNT=$(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | wc -l)
        if [ "$APK_COUNT" -eq 0 ]; then
          echo "::error::No APK was produced. The build failed to generate an output artifact."
          exit 1
        fi
        echo "=== APK count: $APK_COUNT ==="
        for apk in $(find app/build/outputs/apk -name "*.apk" -type f); do
          echo "APK: $apk"
          ls -lh "$apk"
        done
        echo "apk_count=$APK_COUNT" >> $GITHUB_OUTPUT

    - name: Upload Universal Release APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Epsilon-Music-Universal-APK
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Cleanup Keystore
      if: always()
      run: |
        rm -f keystore.jks
        echo "Keystore cleaned up."
