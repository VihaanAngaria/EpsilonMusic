name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 12 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    # CodeQL builds the DEBUG variant (applicationIdSuffix ".debug"). The
    # google-services plugin fails on debug when google-services.json only contains
    # the release package — hide the file for this analysis-only build so it stays
    # green whether or not the config is committed.
    - name: Hide google-services.json for debug-variant analysis
      run: |
        if [ -f app/google-services.json ]; then
          mv app/google-services.json "$RUNNER_TEMP/google-services.json"
          echo "google-services.json temporarily hidden for the CodeQL debug build"
        fi

    - name: Build project
      run: |
        chmod +x gradlew
        ./gradlew assembleUniversalGmsDebug --no-daemon

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
